name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1', 'pre']
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - version: 'nightly'
            os: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  images:
    name: DocBrowserImages - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: DocBrowserImages
      - uses: julia-actions/julia-runtest@v1
        with:
          project: DocBrowserImages
      - name: DocBrowser's extension for it loads
        shell: bash
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="DocBrowserImages")])
            using DocBrowser, DocBrowserImages
            hasmethod(DocBrowser.png_image, Tuple{String}) || error("DocBrowserImagesExt did not load")'
